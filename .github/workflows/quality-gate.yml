# Reusable quality-gate workflow — copy to .github/workflows/quality-gate.yml
# in your repo. Invoked by workflow_dispatch from GitHubActionsTestRunner;
# the controller passes { run_id, attempt_id, head_sha, selectors_json,
# language } as inputs. Echoes run_id into run-name so the controller can
# correlate the dispatch to a workflow_run.id.

name: quality-gate

run-name: quality-gate · ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Internal quality-gate run id (correlation key)"
        required: true
        type: string
      attempt_id:
        description: "Attempt number within the run"
        required: true
        type: string
      head_sha:
        description: "PR head SHA to check out and test"
        required: true
        type: string
      selectors_json:
        description: "JSON array of TestSelectors to pass to the test harness"
        required: false
        default: "[]"
        type: string
      language:
        description: "Primary language profile: java | node"
        required: false
        default: "java"
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # Minimal permissions — this workflow only needs to read the repo
    # contents to check out the head SHA and run tests. Upload-artifact
    # does not require `actions: write`; artifacts are uploaded via the
    # runner's own privileged channel.
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          # fetch-depth: 0 pulls full history so coverage tools (jacoco,
          # lcov) can diff against base; tune down to a shallower depth
          # if that's not needed.
          fetch-depth: 0

      - name: Set up JDK 21 (java profile)
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20 (node profile)
        if: ${{ inputs.language == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write selectors.json
        # Route `selectors_json` through an env var rather than direct
        # ${{ }} interpolation into the shell — direct interpolation is
        # a shell-injection risk if the value ever contains a single
        # quote. GitHub's security-hardening docs recommend this pattern
        # for all workflow_dispatch inputs that reach a shell.
        env:
          SELECTORS_JSON: ${{ inputs.selectors_json }}
        run: printf '%s' "$SELECTORS_JSON" > /tmp/selectors.json

      - name: Run Gradle tests (java profile)
        if: ${{ inputs.language == 'java' }}
        run: ./gradlew test jacocoTestReport --continue

      - name: Run npm tests (node profile)
        if: ${{ inputs.language == 'node' }}
        # `npm test` shorthand does NOT forward --if-present; that flag
        # only exists on `npm run <script>`. Use the explicit form so
        # repos without a "test" script don't fail the job.
        run: |
          npm ci
          npm run test --if-present

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ inputs.run_id }}-${{ inputs.attempt_id }}-junit
          path: |
            **/build/test-results/**/TEST-*.xml
            **/target/surefire-reports/TEST-*.xml
            **/junit*.xml
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ inputs.run_id }}-${{ inputs.attempt_id }}-coverage
          path: |
            **/build/reports/jacoco/**/jacocoTestReport.xml
            **/coverage-summary.json
            **/coverage-final.json
            **/lcov.info
          if-no-files-found: ignore

      - name: Upload Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ inputs.run_id }}-${{ inputs.attempt_id }}-playwright
          path: |
            **/playwright-report/**
            **/test-results/**/trace.zip
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ inputs.run_id }}-${{ inputs.attempt_id }}-logs
          path: |
            **/build/reports/**/*.txt
            npm-debug.log*
            .npm/_logs/*.log
          if-no-files-found: ignore
